
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Engine</title>
<style>
body { margin: 0; overflow: hidden; background: #101827; }
canvas { display: block; }
#label {
  position: fixed; top: 20px; left: 0; right: 0;
  text-align: center; color: white;
  font: bold 22px Arial; pointer-events: none;
}
</style>
</head>
<body>
<div id="label">HISTORY ENGINE — THE ANCIENT STEPPE</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b9d4);
scene.fog = new THREE.Fog(0x91b9d4, 18, 65);

const camera = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 5, 13);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x69503a, 2));

const sun = new THREE.DirectionalLight(0xffe0a0, 3);
sun.position.set(-5, 10, 6);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0xb69b62 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

function makeRider(x, z, scale) {
  const rider = new THREE.Group();
  rider.position.set(x, 0, z);
  rider.scale.setScalar(scale);
  scene.add(rider);

  const brown = new THREE.MeshStandardMaterial({ color: 0x65402b });
  const dark = new THREE.MeshStandardMaterial({ color: 0x292b35 });
  const skin = new THREE.MeshStandardMaterial({ color: 0xc68c63 });

  function part(geo, mat, x, y, z) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    rider.add(m);
    return m;
  }

  part(new THREE.BoxGeometry(1.5, 0.55, 0.5), brown, 0, 1, 0);
  part(new THREE.SphereGeometry(0.28, 16, 12), brown, 0.65, 1.2, 0);
  part(new THREE.CylinderGeometry(0.07, 0.1, 0.65), brown, 0.95, 0.85, 0);
  part(new THREE.BoxGeometry(0.45, 0.75, 0.4), dark, -0.05, 1.65, 0);
  part(new THREE.SphereGeometry(0.23, 16, 12), skin, 0.05, 2.18, 0);
  part(new THREE.SphereGeometry(0.25, 16, 12), dark, 0.05, 2.3, 0);

  const legs = [];
  for (const side of [-1, 1]) {
    const leg = part(
      new THREE.BoxGeometry(0.18, 0.65, 0.2),
      dark, side * 0.25, 0.55, 0
    );
    legs.push(leg);
  }

  rider.userData.legs = legs;
  rider.userData.phase = Math.random() * Math.PI * 2;
  return rider;
}

const riders = [];
riders.push(makeRider(0, 2, 1.0));
riders.push(makeRider(-3, -2, 0.7));
riders.push(makeRider(3, -4, 0.55));
riders.push(makeRider(-6, -7, 0.45));
riders.push(makeRider(6, -8, 0.4));

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  camera.position.x = Math.sin(t * 0.18) * 1.5;
  camera.position.y = 5 + Math.sin(t * 0.4) * 0.25;
  camera.lookAt(0, 1, -1);

  for (const r of riders) {
    r.position.x += Math.sin(t * 0.8 + r.userData.phase) * 0.002;
    r.userData.legs.forEach((leg, i) => {
      leg.rotation.z = Math.sin(t * 5 + i * Math.PI) * 0.22;
    });
  }

  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
  </html>
